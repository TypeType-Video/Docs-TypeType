clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, main]
  - event: pull_request
  - event: manual

steps:
  - name: docs
    image: oven/bun:1.3.14-slim@sha256:d56a2534ffd262e92c12fd3249d3924d296d97086da773f821d7d0477435ea04
    commands:
      - |
        set -eu
        apt-get update
        apt-get install --yes --no-install-recommends ca-certificates curl git tar
        install -d /tmp/typos
        curl -fsSL \
          https://github.com/crate-ci/typos/releases/download/v1.50.1/typos-v1.50.1-x86_64-unknown-linux-musl.tar.gz \
          | tar -xz -C /tmp/typos
        /tmp/typos/typos
        bun install --frozen-lockfile
        bun run docs:build
