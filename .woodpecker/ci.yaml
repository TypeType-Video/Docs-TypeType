clone:
  git:
    image: woodpeckerci/plugin-git:2.10.0@sha256:0f06b03ec33137b556c77538563f66c400339052d0c5199d4c3ad1a2a37e1964
    settings:
      partial: false
      depth: 0
      fetch-target-branch: true

when:
  - event: push
    branch: [dev, main]
  - event: pull_request
  - event: manual

steps:
  - name: docs
    image: oven/bun:1.4.4-slim@sha256:13b43f8bb2c63f5d89c56205c4279b85620363296a00ada33ff7ad568f3688e7
    commands:
      - |
        set -eu
        apt-get update
        apt-get install --yes --no-install-recommends ca-certificates curl git tar
        install -d /tmp/typos
        curl -fsSL \
          https://github.com/crate-ci/typos/releases/download/v1.50.1/typos-v1.50.1-x86_64-unknown-linux-musl.tar.gz \
          | tar -xz -C /tmp/typos
        /tmp/typos/typos
        bun install --frozen-lockfile
        bun run docs:build
